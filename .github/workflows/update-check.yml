name: Automated Update Check

on:
  schedule:
    - cron: "0 2 * * 1" # Weekly on Mondays at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-apply-updates:
    name: Check and apply mod updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Check for updates
        id: check
        run: |
          bun run scripts/automation/check-updates.js
          if [ -f updates.json ]; then
            MOD_COUNT=$(jq '.mods | length' updates.json)
            HAS_LOADER=$(jq '.fabricLoader != null' updates.json)
            if [ "$MOD_COUNT" -gt 0 ] || [ "$HAS_LOADER" = "true" ]; then
              echo "has_updates=true" >> $GITHUB_OUTPUT
            else
              echo "has_updates=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply updates
        if: steps.check.outputs.has_updates == 'true'
        run: bun run scripts/automation/apply-updates.js

      - name: Commit and push
        if: steps.check.outputs.has_updates == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          # Build commit message from updates.json
          MOD_COUNT=$(jq '.mods | length' updates.json)
          MODS=$(jq -r '.mods[].name' updates.json | paste -sd ', ' -)
          HAS_LOADER=$(jq '.fabricLoader != null' updates.json)

          MSG="feat: update mods"
          BODY=""
          if [ "$MOD_COUNT" -gt 0 ]; then
            BODY="Updated mods: ${MODS}"
          fi
          if [ "$HAS_LOADER" = "true" ]; then
            LOADER_VER=$(jq -r '.fabricLoader.latestVersion' updates.json)
            if [ -n "$BODY" ]; then
              BODY="${BODY}\nFabric Loader updated to ${LOADER_VER}"
            else
              BODY="Fabric Loader updated to ${LOADER_VER}"
            fi
          fi

          git commit -m "${MSG}" -m "${BODY}"
          git push
