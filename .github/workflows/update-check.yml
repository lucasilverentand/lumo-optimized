name: Release Creator

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: release-creator
  cancel-in-progress: false

env:
  RELEASE_BRANCH: automation/release-candidate

jobs:
  release-candidate:
    name: Create release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Prepare release candidate
        id: candidate
        run: bun run release:candidate

      - name: Create verified release commit
        if: steps.candidate.outputs.has_updates == 'true'
        id: commit
        env:
          COMMIT_MESSAGE_FILE: ${{ steps.candidate.outputs.commit_message_file }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run scripts/automation/create-github-commit.js

      - name: Open or update release candidate PR
        if: steps.commit.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh label create release-candidate \
            --description "Automated release candidate" \
            --color "5319e7" \
            --force
          gh label create automated-update \
            --description "Automated mod update PR" \
            --color "0366d6" \
            --force
          gh label create needs-validation \
            --description "PR needs automated validation" \
            --color "d73a4a" \
            --force
          gh label create validated \
            --description "Automated validation passed" \
            --color "0e8a16" \
            --force

          if gh pr view "$RELEASE_BRANCH" >/dev/null 2>&1; then
            gh pr edit "$RELEASE_BRANCH" \
              --title "fix(deps): update modpack release candidate" \
              --body-file "${{ steps.candidate.outputs.pr_body_file }}" \
              --add-label release-candidate \
              --add-label automated-update \
              --add-label needs-validation
          else
            gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "fix(deps): update modpack release candidate" \
              --body-file "${{ steps.candidate.outputs.pr_body_file }}" \
              --label release-candidate \
              --label automated-update \
              --label needs-validation
          fi

          gh pr edit "$RELEASE_BRANCH" --remove-label validated || true
          PR_NUMBER=$(gh pr view "$RELEASE_BRANCH" --json number --jq .number)
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Run release candidate checks
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          set_status() {
            local state="$1"
            local context="$2"
            local description="$3"
            local target_url="${4:-}"
            local args=(
              repos/"$GITHUB_REPOSITORY"/statuses/"$HEAD_SHA"
              -f "state=$state"
              -f "context=$context"
              -f "description=$description"
            )

            if [ -n "$target_url" ]; then
              args+=(-f "target_url=$target_url")
            fi

            gh api "${args[@]}" >/dev/null
          }

          set_status pending "release-candidate/build" "Build Modpack is running"
          set_status pending "release-candidate/validation" "Compatibility validation is running"

          gh workflow run build.yml --ref "$RELEASE_BRANCH"
          gh workflow run validate-compatibility.yml --ref "$RELEASE_BRANCH" -f pr_number="$PR_NUMBER"

          wait_for_run() {
            local workflow="$1"
            local context="$2"
            local description="$3"
            local run_id=""

            for _ in $(seq 1 30); do
              run_id=$(gh run list \
                --workflow "$workflow" \
                --branch "$RELEASE_BRANCH" \
                --event workflow_dispatch \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" \
                | head -n 1)

              if [ -n "$run_id" ]; then
                local run_url
                run_url=$(gh run view "$run_id" --json url --jq .url)

                if gh run watch "$run_id" --exit-status; then
                  set_status success "$context" "$description" "$run_url"
                  return
                fi

                set_status failure "$context" "$workflow failed" "$run_url"
                return 1
              fi

              sleep 2
            done

            set_status failure "$context" "$workflow did not start"
            echo "::error::Timed out waiting for $workflow to start for $HEAD_SHA."
            exit 1
          }

          wait_for_run build.yml "release-candidate/build" "Build Modpack passed"
          wait_for_run validate-compatibility.yml "release-candidate/validation" "Compatibility validation passed"

          gh pr ready "$PR_NUMBER" || true
          gh pr edit "$PR_NUMBER" --remove-label "needs-validation" || true
          gh pr edit "$PR_NUMBER" --add-label "validated"

      - name: Enable release candidate auto-merge
        if: steps.commit.outputs.has_changes == 'true' && vars.RELEASE_CREATOR_AUTO_MERGE == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ vars.RELEASE_CREATOR_AUTO_MERGE }}" = "true" ]; then
            gh pr merge "$RELEASE_BRANCH" \
              --auto \
              --merge \
              --delete-branch
          fi

      - name: Report no updates
        if: steps.candidate.outputs.has_updates == 'false'
        run: cat "${{ steps.candidate.outputs.summary_file }}"

      - name: Upload release candidate summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-summary
          path: |
            .release-candidate/*.md
            updates.json
            validation-results.json
          if-no-files-found: ignore
          retention-days: 30
