name: Build Modpack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate compatibility metadata
        run: bun run scripts/automation/validate-compatibility.js

      - name: Validate committed Packwiz index
        run: |
          packwiz refresh
          git diff --exit-code pack.toml index.toml

      - name: Export modpack
        run: |
          VERSION=$(grep '^version' pack.toml | cut -d'"' -f2)
          mkdir -p dist

          packwiz modrinth export -o "dist/lumo-optimized-${VERSION}.mrpack"
          packwiz curseforge export -o "dist/lumo-optimized-${VERSION}-curseforge.zip"

          echo "Built version ${VERSION}"
          ls -la dist/

      - name: Smoke test exported artifacts
        run: |
          VERSION=$(grep '^version' pack.toml | cut -d'"' -f2)

          test -s "dist/lumo-optimized-${VERSION}.mrpack"
          test -s "dist/lumo-optimized-${VERSION}-curseforge.zip"

          unzip -t "dist/lumo-optimized-${VERSION}.mrpack"
          unzip -t "dist/lumo-optimized-${VERSION}-curseforge.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modpack-build
          path: dist/
          retention-days: 30
