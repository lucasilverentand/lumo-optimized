name: Build Modpack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Build modpack
        run: |
          VERSION=$(grep '^version' pack.toml | cut -d'"' -f2)
          mkdir -p dist

          packwiz refresh
          packwiz modrinth export -o "dist/lumo-optimized-${VERSION}.mrpack"
          packwiz curseforge export -o "dist/lumo-optimized-${VERSION}-curseforge.zip"

          echo "Built version ${VERSION}"
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modpack-build
          path: dist/
          retention-days: 30
