name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-upload:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Build modpack
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          MC_VERSION=$(grep '^minecraft' pack.toml | cut -d'"' -f2)
          echo "Building Lumo Optimized v${VERSION} for Minecraft ${MC_VERSION}"

          make all

          ls -la dist/

      - name: Smoke test release artifacts
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          test -s "dist/lumo-optimized-${VERSION}.mrpack"
          test -s "dist/lumo-optimized-${VERSION}-curseforge.zip"

          unzip -t "dist/lumo-optimized-${VERSION}.mrpack"
          unzip -t "dist/lumo-optimized-${VERSION}-curseforge.zip"

      - name: Upload release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "${TAG_NAME}" dist/*.mrpack dist/*.zip --clobber

  auto-merge-release-pr:
    needs: release-please
    if: vars.RELEASE_CREATOR_AUTO_RELEASE == 'true' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge for Release Please PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head release-please--branches--main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "No open Release Please PR found."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --merge \
            --delete-branch
